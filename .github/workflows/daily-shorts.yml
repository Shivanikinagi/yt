name: Daily Shorts

on:
  schedule:
    # 01:30 UTC = 07:00 IST. GitHub cron may start up to ~15-30 min late under load.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of Shorts (default from settings.yaml)"
        required: false
        default: ""
      long:
        description: "Number of long-form videos (default from settings.yaml)"
        required: false
        default: ""
      no_upload:
        description: "Skip YouTube upload"
        type: boolean
        default: false

permissions:
  contents: write     # commit state/ and reports/ back
  models: read        # free GitHub Models fallback LLM via GITHUB_TOKEN

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150        # hard cap; the app stops itself at max_runtime_minutes (140)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # same as the local .venv
          cache: pip

      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation > /dev/null

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (Linux catches platform-specific bugs before a 2-hour run)
        run: pip install -q pytest && python -m pytest -q tests

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: models/piper
          key: piper-${{ hashFiles('config/settings.yaml') }}

      - name: Environment check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: python -m shorts_factory doctor

      # Today's X content (tweet, accounts to follow, draft replies) for posting by hand.
      # Runs before the long video job and never fails the workflow.
      - name: Daily X content
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m shorts_factory tweet

      - name: Daily production run
        env:
          CI: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          ALLOW_PUBLIC_SCHEDULING: ${{ vars.ALLOW_PUBLIC_SCHEDULING || 'false' }}
          SHORTS_PUBLISH_MODE: ${{ vars.SHORTS_PUBLISH_MODE || '' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.long }}" ]; then ARGS="$ARGS --long ${{ inputs.long }}"; fi
          if [ "${{ inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          set +e
          python -m shorts_factory run $ARGS
          echo "RUN_EXIT=$?" >> "$GITHUB_ENV"

      - name: Publish report to the job summary
        if: always()
        run: |
          TWEETS="tweets/$(TZ=Asia/Kolkata date +%Y-%m-%d).md"
          if [ -f "$TWEETS" ]; then cat "$TWEETS" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; else echo "no report written" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload videos and logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.srt
            output/**/script.json
            output/**/qc.json
            output/**/thumbnail.jpg
            output/logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Commit state and report
        if: always()
        run: |
          git config user.name "shorts-factory-bot"
          git config user.email "shorts-factory-bot@users.noreply.github.com"
          git add state reports
          if [ -d tweets ]; then git add tweets; fi
          git commit -m "chore: daily run $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push failed (check branch protection)"

      # Fail the job when the run produced nothing, so GitHub's built-in notifications
      # (email on failed scheduled workflows) act as free monitoring. Artifacts, the summary
      # and the state commit above still happen because they run with `if: always()`.
      - name: Fail job if the run produced no video
        if: always()
        run: |
          echo "run exit code: ${RUN_EXIT:-unknown}"
          if [ "${RUN_EXIT:-1}" != "0" ]; then exit 1; fi
