# Tech Shorts Factory - main settings
# Environment variables override a few of these (see .env.example and shorts_factory/config.py).

project_name: "Tech Shorts Factory"
timezone: "Asia/Kolkata"
# Shorts per day (long-form videos per day: long_video.daily_target)
daily_target: 2
# Hard stop for a daily run. The GitHub workflow uses 150 min so the report still gets written.
max_runtime_minutes: 140
# Do not start producing another video when less than this remains.
per_video_reserve_minutes: 7
# Keep this much time for uploads + report at the end of the run.
upload_reserve_minutes: 8

video:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 25
  max_seconds: 59
  crf: 21
  preset: veryfast
  lead_in_seconds: 0.5       # silence before the first narration
  scene_gap_seconds: 0.35    # pause between scenes
  tail_seconds: 1.0          # hold after the last narration
  transition_seconds: 0.4    # how long a new scene takes to settle into the frame
  # One shared layout; the theme only rotates the accent colours. Options: neon, blueprint, voxel, sunset, terminal
  themes: [neon, voxel, blueprint, sunset, terminal]
  # Each video is a conversation: [host who explains, guest who asks]. Pairs rotate per video and per day.
  # Anime style: yuki, sora, hana, ren. Cartoon: nova, kai, bit (robot), mochi (cat).
  # One name per pair = a single talking host; [] = plain narrator with no characters.
  cast_pairs: [[yuki, sora], [hana, ren], [nova, kai], [bit, mochi], [ren, hana]]
  # Film the conversation: close-ups/wide shots for the chat, cut to the info panel for the facts.
  cinematic: true

# Long-form videos (16:9). Same characters and look, filmed as chapters. Keys here override `video`.
long_video:
  daily_target: 1
  width: 1920
  height: 1080
  min_seconds: 300
  max_seconds: 840             # stay under 15 min, the upload limit for channels without phone verification
  crf: 22
  scene_gap_seconds: 0.4
  tail_seconds: 1.5
  target_words: [1250, 1650]   # ~8-10 min of dialogue; 8+ min allows mid-roll ads once monetised
  chapters: [5, 7]
  min_source_chars: 3000       # a deep dive needs real material; thinner news topics stay Shorts
  reserve_minutes: 24          # do not start a long video with less time than this left
  cast_pairs: [[nova, kai], [hana, ren], [yuki, sora]]
  schedule_slots_local: ["17:00"]
  captions_max_words: 5
  captions_max_chars: 30
  # documentary = real photos (Wikipedia/Wikimedia Commons) and stock footage (Pexels, needs the free
  # PEXELS_API_KEY) cut every few seconds, with the characters only in the intro, reactions and outro.
  # Anything else = the Shorts look in 16:9.
  style: documentary

# Daily feedback loop: the channel's own view counts and YouTube's most-popular tech videos steer
# topic ranking and the script prompts. Read-only calls, about 5 quota units a day.
analytics:
  enabled: true
  trend_regions: [US, IN, GB]
  trend_category_id: "28"
  min_age_days: 2              # judge a video only once it had time to collect views

brand:
  channel_name: "TechDecoded"      # <- change to your channel name
  handle: "@TechDecoded60-y6b"            # <- change to your handle
  cta: "New tech explained every day"
  # Bundled OFL fonts (assets/fonts) so the GitHub runner renders the same as your PC.
  font_candidates_headline:
    - assets/fonts/ArchivoBlack-Regular.ttf
    - C:/Windows/Fonts/ariblk.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  font_candidates_bold:
    - assets/fonts/IBMPlexSans-SemiBold.ttf
    - C:/Windows/Fonts/segoeuib.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  font_candidates_regular:
    - assets/fonts/IBMPlexSans-Regular.ttf
    - C:/Windows/Fonts/segoeui.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
  font_candidates_mono:
    - assets/fonts/IBMPlexMono-Medium.ttf
    - C:/Windows/Fonts/consola.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  font_candidates_mono_bold:
    - assets/fonts/IBMPlexMono-Bold.ttf
    - C:/Windows/Fonts/consolab.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf

llm:
  # Tried in order; "template" is the always-available deterministic writer.
  providers: [groq, ollama, github_models, gemini, openrouter, template]
  groq_model: "openai/gpt-oss-120b"
  groq_fallback_model: "openai/gpt-oss-20b"
  ollama_model: "llama3.1:8b"
  github_model: "openai/gpt-4o-mini"
  gemini_model: "gemini-2.0-flash"
  openrouter_model: "meta-llama/llama-3.3-70b-instruct:free"
  timeout_seconds: 90
  max_attempts_per_topic: 2
  max_output_tokens: 3500
  temperature: 0.8

tts:
  # Tried in order. kokoro = offline open source, natural (default). piper = offline, more robotic
  # (fallback). groq = Orpheus via Groq (needs terms
  # acceptance in the Groq console). edge = Microsoft Edge read-aloud (unofficial endpoint, opt-in).
  # sapi = Windows built-in voices (Windows only, last resort).
  engines: [kokoro, piper, groq, sapi, edge]
  piper_voice: "en_US-lessac-medium"
  kokoro_voice: "af_heart"           # characters have their own voices in characters.py
  kokoro_speed: 1.0
  piper_length_scale: 0.95           # <1 = faster speech
  groq_tts_model: "canopylabs/orpheus-v1-english"
  groq_tts_voice: "troy"
  edge_voice: "en-US-ChristopherNeural"
  sample_rate: 48000
  words_per_minute_estimate: 165

captions:
  # Word timestamps from Groq Whisper when available, otherwise proportional timing.
  use_whisper_alignment: true
  whisper_model: "whisper-large-v3-turbo"
  max_words_per_chunk: 4
  max_chars_per_chunk: 24

research:
  news_max_age_days: 7
  candidates: 14
  min_summary_chars: 140
  dedupe_days: 120
  title_similarity_threshold: 0.78
  max_per_source: 2
  verify_urls: true
  enrich_articles: true          # fetch the article page for a text excerpt when the feed summary is thin
  request_timeout_seconds: 15

qc:
  strict_numbers: true
  max_unverified_numbers: 1
  min_file_size_kb: 300
  min_rms_dbfs: -35

music:
  enabled: true
  gain_db: -24

youtube:
  enabled: true
  # private  -> uploads stay private (test mode, default)
  # unlisted -> uploads are unlisted
  # scheduled-> private now, auto-published at the next slot (requires ALLOW_PUBLIC_SCHEDULING=true)
  publish_mode: private
  category_id: "28"              # Science & Technology
  default_language: "en"
  # Shorts slots (long-form uses long_video.schedule_slots_local)
  schedule_slots_local: ["09:00", "20:00"]
  schedule_min_lead_minutes: 60
  daily_quota_budget: 9000       # YouTube Data API default quota is 10000 units/day
  upload_cost_units: 1600        # documented cost; reports say it dropped to 100 in Dec 2025, kept conservative
  thumbnail_cost_units: 50
  upload_captions: false         # +400 units per video; off to keep uploads within quota
  custom_thumbnails: true        # long-form only; needs a phone-verified channel, otherwise skipped with a warning
  made_for_kids: false
  declare_synthetic_media: true
  description_footer: |
    This video was produced by an automated pipeline: AI-written script, synthetic (text-to-speech)
    narration and generated motion graphics. Sources are listed above.
